name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri application and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GuetLinker ${{ github.ref_name }}'
          releaseBody: |
            ## GuetLinker ${{ github.ref_name }}

            面向桂林电子科技大学（GUET）校园网的现代化跨平台桌面客户端。
            基于 **Tauri 2 + Rust + Vue 3** 架构打造，具备轻量、安全、免 Python 运行环境的特点。

            ### 下载与版本选择
            - 🚀 **便携免安装版 (`GuetLinker_${{ github.ref_name }}_x64_Portable.exe`)**：纯原生单文件，下载后直接双击运行，即开即用、绿色免安装。
            - 📦 **标准安装包版 (`GuetLinker_*_x64-setup.exe`)**：带有安装向导，自动创建桌面与开始菜单快捷方式，支持规范的开机自启与卸载。

            > [!TIP]
            > 首次运行若遇到 Windows SmartScreen 拦截提示，点击“更多信息” -> “仍要运行”即可。
          releaseDraft: false
          prerelease: false

      - name: Prepare portable executable
        run: |
          Copy-Item "src-tauri/target/release/guetlinker-desktop.exe" -Destination "GuetLinker_${{ github.ref_name }}_x64_Portable.exe"

      - name: Upload portable executable to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: GuetLinker_${{ github.ref_name }}_x64_Portable.exe

